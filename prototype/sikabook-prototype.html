.chart svg{width:100%;height:auto;display:block;overflow:visible}

.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

.day input{text-align:right;font-variant-numeric:tabular-nums}
.sumbar{position:sticky;bottom:0;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}

function niceMax(m){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(m,1)))); for(const f of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(f*p>=m) return f*p; return 10*p; }
function barChart(labels, values, aria){
  const w=isDesk()?640:360, h=200, pl=40, pr=10, pt=22, pb=26, iw=w-pl-pr, ih=h-pt-pb;
  const max=niceMax(Math.max(...values,1)), n=values.length, step=iw/n, bw=Math.max(6,Math.min(34,step*.62)), r=4, y=v=>pt+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(aria)}">`;
  [0,.5,1].forEach(f=>{ const yy=pt+ih-f*ih; s+=`<line class="cg" x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}"/><text class="ct" x="${pl-6}" y="${yy+4}" text-anchor="end">${short(max*f)}</text>`; });
  const every=Math.ceil(n/(isDesk()?12:6));
  values.forEach((v,i)=>{ const x=pl+i*step+(step-bw)/2, top=y(v), base=pt+ih, rr=Math.min(r,base-top);
    if(v>0) s+=`<path class="cb ${i===n-1?'last':''}" d="M${x},${base}V${top+rr}Q${x},${top} ${x+rr},${top}H${x+bw-rr}Q${x+bw},${top} ${x+bw},${top+rr}V${base}Z"/>`;
    s+=`<rect class="hit" x="${pl+i*step}" y="${pt}" width="${step}" height="${ih}" data-tip="${esc(labels[i])} · ${fmt(v)}"/>`;
    if((n-1-i)%every===0) s+=`<text class="ct" x="${x+bw/2}" y="${h-8}" text-anchor="middle">${esc(labels[i])}</text>`; });
  const lx=pl+(n-1)*step+step/2; s+=`<text class="ctv" x="${Math.min(lx,w-pr-14)}" y="${y(values[n-1])-7}" text-anchor="middle">${short(values[n-1])}</text>`;
  return `<div class="chart">${s}</svg></div>`;
}
// Two lines: actual (solid, brand) vs plan (dashed, neutral reference)
function lineChart(labels, actual, plan, aria, names){
  const w=isDesk()?640:360, h=220, pl=42, pr=14, pt=16, pb=26, iw=w-pl-pr, ih=h-pt-pb, n=labels.length;
  const max=niceMax(Math.max(...actual.filter(v=>v!=null),...plan)), X=i=>pl+i*(iw/(n-1)), Y=v=>pt+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(aria)}">`;
  [0,.25,.5,.75,1].forEach(f=>{ const yy=pt+ih-f*ih; s+=`<line class="cg" x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}"/>${f%.5===0?`<text class="ct" x="${pl-6}" y="${yy+4}" text-anchor="end">${short(max*f)}</text>`:''}`; });
  const pts=actual.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean), last=pts[pts.length-1];
  s+=`<path class="ar" d="M${pts[0][0]},${pt+ih}L${pts.map(p=>p.join(',')).join('L')}L${last[0]},${pt+ih}Z"/>`;
  s+=`<path class="ln b" d="M${plan.map((v,i)=>X(i)+','+Y(v)).join('L')}"/>`;
  s+=`<path class="ln a" d="M${pts.map(p=>p.join(',')).join('L')}"/>`;
  s+=`<circle class="dot" cx="${last[0]}" cy="${last[1]}" r="4.5"/>`;
  const every=isDesk()?1:2;
  labels.forEach((l,i)=>{ if(i%every===0||i===n-1) s+=`<text class="ct" x="${X(i)}" y="${h-8}" text-anchor="middle">${l}</text>`;
    const tipTxt = `${l} · ${names[0]} ${actual[i]==null?'—':fmt(actual[i])} · ${names[1]} ${fmt(plan[i])}`;
    s+=`<rect class="hit" x="${X(i)-iw/(n-1)/2}" y="${pt}" width="${iw/(n-1)}" height="${ih}" data-tip="${esc(tipTxt)}"/>`; });
  s+=`<text class="ctv" x="${last[0]}" y="${last[1]-10}" text-anchor="middle">${short(actual[pts.length-1])}</text>`;
  return `<div class="legend"><span><i class="sw"></i>${names[0]}</span><span><i class="sw b"></i>${names[1]}</span></div><div class="chart">${s}</svg></div>`;
}

function budgetView(){
  const bl=budgets.map((b,i)=>({...b,i})).filter(b=>inScope(b.u)), bT=bl.reduce((s,b)=>s+b.budget,0), bS=bl.reduce((s,b)=>s+b.spent,0);

  const tg=targets.filter(t=>inScope(t.u));
  const projected=bS/pace;
  return `<div class="pagehead"><h2>Budget 2026</h2><span class="muted">${esc(scopeLabel())}. Every approved expense comes off its budget line automatically.</span></div>
  <div class="stack">
    <div class="tiles">
      <div class="tile"><span>Budgeted for 2026</span><b>${fmt(bT)}</b></div>
      <div class="tile"><span>Spent so far</span><b>${fmt(bS)}</b><span>${bT?Math.round(bS/bT*100):0}% used · ${Math.round(pace*100)}% of the year gone</span></div>

      <div class="tile"><span>Compared with plan</span><b style="color:${diff>=0?'var(--good)':'var(--bad)'}">${diff>=0?'Under':'Over'} by ${fmt(Math.abs(diff))}</b><span>If spending continues: ${fmt(projected)} by Dec</span></div>
    </div>
    <div class="grid2"><div class="col">
      <div class="card"><div class="cardhead"><h3>Spending through the year</h3><span class="muted">Tap a month</span></div>

        <span class="muted">When the solid line is below the dashed line, you are spending less than planned.</span></div>
      <div class="card"><div class="cardhead"><h3>Income targets</h3><span class="muted">2026</span></div><div class="bars">
        ${tg.map(t=>{const p=t.got/t.target*100; return `<div class="bar"><span><b style="font-weight:500">${esc(t.name)}</b>${S.view==='all'&&visibleIds().length>1?` <span class="muted">· ${esc(uName(t.u))}</span>`:''}</span><span class="right"><b class="num">${Math.round(p)}%</b><span class="muted num">${fmt(t.got)} of ${fmt(t.target)}</span></span><div class="track"><div class="fill ${p>=pace*100?'':'gold'}" style="width:${Math.min(100,p)}%"></div><div class="pace" style="left:${pace*100}%"></div></div></div>`}).join('')||'<span class="muted">No targets yet.</span>'}</div>
        <span class="muted">Green: on track. Gold: behind where it should be by now (the dark mark).</span></div>
    </div><div class="col">
      <div class="card"><h3>Budget lines</h3><div class="bars">
        ${bl.map(b=>{const p=b.budget?b.spent/b.budget*100:0, cls=p>100?'bad':p>=pace*100+5?'warn':'', left=b.budget-b.spent;

function reportsView(){
  const sc=scope(), t=txs.filter(x=>inScope(x.u)&&x.d.startsWith('2026-11')), ex=expenses.filter(x=>inScope(x.u)&&spentNow(x)&&x.d.startsWith('2026-11'));

  const byCat={}; t.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.amt);
  const byLine={}; ex.forEach(x=>byLine[x.budget||'Other']=(byLine[x.budget||'Other']||0)+x.amt);
  const hist=['Jun','Jul','Aug','Sep','Oct'].map((m,i)=>({m,inc:Math.round(inc*[.86,.92,.88,1.04,.97][i]),out:Math.round(out*[.74,1.1,.81,.95,1.02][i])})).concat([{m:'Nov',inc,out}]);
  return `<div class="pagehead row"><div><h2>Reports</h2><span class="muted">${esc(scopeLabel())} · November 2026</span></div>
    <div class="btnrow"><button class="btn small ghost" data-act="export" data-id="PDF">PDF</button><button class="btn small ghost" data-act="export" data-id="Excel">Excel</button><button class="btn small" data-act="export" data-id="WhatsApp">Share on WhatsApp</button></div></div>
  <div class="stack"><div class="grid2"><div class="col">
    <div class="card"><h3>Monthly statement · November 2026</h3>
      <dl class="kv"><dt>Opening balance (1 Nov)</dt><dd class="num">${fmt(open)}</dd></dl>
      <div class="tbl"><table><thead><tr><th>Income</th><th></th></tr></thead><tbody>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmt(v)}</td></tr>`).join('')}<tr class="total"><td>Total income</td><td class="pos">${fmt(inc)}</td></tr></tbody></table></div>
      <div class="tbl"><table><thead><tr><th>Expenses (by budget line)</th><th></th></tr></thead><tbody>${Object.entries(byLine).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmt(v)}</td></tr>`).join('')}<tr class="total"><td>Total expenses</td><td class="neg">${fmt(out)}</td></tr></tbody></table></div>
      <dl class="kv"><dt>Surplus for the month</dt><dd class="num" style="color:${inc-out>=0?'var(--good)':'var(--bad)'}">${fmt(inc-out)}</dd><dt><b>Closing balance (30 Nov)</b></dt><dd class="num"><b>${fmt(close)}</b></dd></dl>
    </div>
  </div><div class="col">
    <div class="card"><h3>Last 6 months</h3><div class="tbl"><table><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Surplus</th></tr></thead><tbody>
      ${hist.map(h=>`<tr><td>${h.m}</td><td>${h.inc.toLocaleString('en-US')}</td><td>${h.out.toLocaleString('en-US')}</td><td class="${h.inc-h.out>=0?'pos':'neg'}">${(h.inc-h.out).toLocaleString('en-US')}</td></tr>`).join('')}</tbody></table></div>
      <span class="muted">Jun–Oct are example figures.</span></div>
    <div class="card"><h3>Surplus each month</h3>${barChart(hist.map(h=>h.m),hist.map(h=>Math.max(0,h.inc-h.out)),'Surplus each month')}</div>
    <div class="card"><h3>Other reports</h3><div class="list">
      ${['Member giving statements (yearly)','Budget vs actual (full year)','Day Born report by quarter','Fundraising & pledges report','Audit trail (every change)'].filter(r=>S.type==='church'||!r.startsWith('Day')).map(r=>`<button class="item" data-act="export" data-id="${esc(r)}"><span class="t"><b>${r}</b></span><span class="chev">›</span></button>`).join('')}</div></div>
  </div></div></div>`;
}

  if(sh.t==='more') return `<div class="sheet" role="dialog" aria-label="More">${head('More')}<div class="menu">${MORE().map(([k,i,l])=>`<button data-act="tab" data-id="${k}"><i>${i}</i>${l}</button>`).join('')}</div></div>`;
  if(sh.t==='expense'){ const x=expenses.find(e=>e.id===sh.id); if(!x) return ''; const [c,lab]=ST[x.st];
    return `<div class="sheet" role="dialog" aria-label="Expense details">${head('Expense details')}
      <div><div class="bigamt num">${fmt(x.amt)}</div><span class="chip ${c}">${lab}</span></div>

      <label class="f">Member (optional)<select id="im"><option value="">— No member —</option>${members.filter(x=>x.units.some(inScope)).map(x=>`<option value="${x.id}" ${m&&m.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
      <div class="row2"><label class="f">Amount (${curSym()})<input type="number" id="ia" inputmode="decimal" placeholder="0.00"></label>
      <label class="f">Paid by<select id="ipm"><option>Cash</option><option>Mobile Money</option><option>Bank transfer</option><option>Cheque</option></select></label></div>
      ${S.feat.sms?`<label class="toggle"><span>Text a receipt to the member</span><input type="checkbox" id="isms" checked></label>`:''}
      <button class="btn" data-act="saveincome">Save</button></div>`; }

      <label class="f">What for<input type="text" id="xline" placeholder="e.g. Refreshments"></label>

  document.getElementById('root').innerHTML = desk
    ? `<div class="shell"><aside class="side"><div class="logo"><i>₵</i><span>SikaBook</span></div><span class="orgname">${nm}</span>${unitSel}
        <nav aria-label="Main">${MAIN().map(navBtn).join('')}<span class="navlab">More</span>${MORE().map(navBtn).join('')}</nav>${demo}</aside>
        <main class="main"><div class="deskhead"><div><span class="muted">${esc(scopeLabel())}</span><h1>${TITLES[S.tab]}</h1></div><div class="btnrow"><button class="btn ghost" data-act="sheet" data-t="income">＋ Income</button><button class="btn ghost" data-act="sheet" data-t="expnew">− Expense</button></div></div>${content}</main></div>`
    : `<div class="shell"><main class="main">${demo}<header class="top"><div class="logo"><i>₵</i><span>${nm}</span></div>${unitSel}<button class="iconbtn" data-act="sheet" data-t="more" aria-label="More">☰</button></header>${content}</main></div>`;
  const tabs=MAIN();
  document.getElementById('tabs').innerHTML=`<div style="--n:${tabs.length}">${tabs.map(navBtn).join('')}</div>`;
  document.getElementById('layer').innerHTML=S.sheet?`<div class="sheetbg" data-act="bg">${sheetHTML()}</div>`:'';
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
const val=id=>(document.getElementById(id)||{}).value||'';
const chk=id=>!!(document.getElementById(id)||{}).checked;
const top0=()=>window.scrollTo(0,0);
const firstUnit=()=>S.view==='all'?visibleIds()[0]:S.view;

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id, i=+el.dataset.i;
  if(a==='bg'&&e.target!==el) return;
  switch(a){
    case 'stype': S.orgName=val('oname'); S.cur=val('ocur')||S.cur; S.type=id; S.feat.dayborn = id==='church'; break;
    case 'finishsetup': S.orgName=val('oname').trim(); S.cur=val('ocur'); if(S.type==='church') S.feat.dayborn=chk('fdb'); else S.feat.dayborn=false; S.feat.pledges=chk('fpl'); S.feat.sms=chk('fsms');
      loadData(S.type); S.setup=false; S.tab='home'; S.view='all'; S.role='me'; top0(); break;
    case 'resetup': S.setup=true; S.sheet=null; top0(); break;
    case 'role': S.role=id; S.view=ROLES()[id].units==='all'?'all':ROLES()[id].units[0]; S.member=S.payee=S.camp=null; S.group=null; S.tab='home'; S.showAll=S.showOwing=false; S.q=''; break;
    case 'layout': S.forcePhone=id==='phone'; break;
    case 'tab': S.tab=id; S.member=S.payee=S.camp=null; S.group=null; S.sheet=null; top0(); break;
    case 'view': S.view=id; top0(); break;
    case 'member': S.member=id||null; top0(); break;
    case 'gomember': S.tab='members'; S.member=id; S.group=null; top0(); break;
    case 'group': S.group=i>=0?i:null; top0(); break;
    case 'camp': S.camp=id||null; top0(); break;
    case 'showall': S.showAll=true; break;
    case 'owing': S.showOwing=true; break;
    case 'remind': { const m=members.find(x=>x.id===id); log(`Sent payment reminder to ${m.name}`); toast(`Reminder sent to ${m.name} (demo).`); return; }
    case 'remindall': log('Sent November payment reminders'); toast('Reminders sent (demo).'); return;
    case 'statement': { const m=members.find(x=>x.id===id); toast(`2026 statement sent to ${m.name} by SMS (demo).`); return; }
    case 'export': toast(id==='Invite'?'In the real app, you type a phone number or email and choose what they can see.':id==='Photo'?'In the real app, this opens the camera to snap the receipt.':`In the real app, this creates “${id}” for you to download or share.`); return;
    case 'payee': S.payee=id||null; top0(); break;
    case 'skind': S.spendKind=id; break;
    case 'sheet': S.sheet={t:el.dataset.t,id,i,member:el.dataset.member,k:el.dataset.k,fund:el.dataset.fund}; break;
    case 'pay': { const p=payees.find(x=>x.id===id), l=p.lines[i]; expenses.push(E(p.u,'2026-11-21',p.id,p.name,l.n,l.a,'pending',p.kind==='project'?orgSafe('Building fund'):'General fund',l.b)); log(`Recorded expense: ${p.name} — ${l.n} ${l.a.toLocaleString('en-US')}`); toast(`${l.n} · ${fmt(l.a)} recorded. Waiting for approval.`); break; }
    case 'approve': { const x=expenses.find(e=>e.id===id); x.st='approved'; const b=budgets.find(y=>y.u===x.u&&y.name===x.budget); if(b) b.spent+=x.amt; log(`Approved expense: ${x.to} — ${x.line}`); toast('Approved. A confirmation link was sent to the recipient (demo).'); break; }
    case 'confirm': { const x=expenses.find(e=>e.id===id); x.st='confirmed'; logs.unshift(['Today '+new Date().toTimeString().slice(0,5),x.to,`Confirmed receiving ${x.line} ${x.amt.toLocaleString('en-US')}`]); toast('Recipient confirmed they received it.'); break; }
    case 'bedit': S.editB=i; break;
    case 'bsave': { const v=parseFloat(val('bedit')); if(v>=0){ log(`Changed budget: ${budgets[i].name} from ${budgets[i].budget.toLocaleString('en-US')} to ${v.toLocaleString('en-US')}`); budgets[i].budget=v; toast('Budget updated. Everything recalculated.'); } S.editB=null; break; }
    case 'badd': { const n=val('bname').trim(), v=parseFloat(val('bamt')); if(!n||!(v>0)){ toast('Enter a name and an amount above 0.'); return; } budgets.push({u:firstUnit(),name:n,budget:v,spent:0}); log(`Added budget line: ${n}`); toast(`“${n}” added to the budget.`); break; }
    case 'savesunday': { const tot=S.sunday.reduce((s,v)=>s+(parseFloat(v)||0),0); if(!tot){ toast('Enter at least one group amount.'); return; }
      SUNDAYS.push('22 Nov'); SUN_ISO.push('2026-11-22'); DAYS.forEach((_,k)=>DB[k].push(parseFloat(S.sunday[k])||0));
      txs.push(T('station','2026-11-22','Day Born','Day Born offering (8 groups)',tot)); S.sunday=DAYS.map(()=>''); S.sheet=null; S.tab='dayborn'; S.group=null;
      log(`Saved Day Born count for 22 Nov — ${tot.toLocaleString('en-US')}`); toast(`Saved ${fmt(tot)}. 22 Nov now shows in the Day Born table and chart.`); break; }
    case 'saveexp': { const v=parseFloat(val('xa')), to=val('xto').trim(), line=val('xline').trim(); if(!(v>0)||!to){ toast('Enter who was paid and an amount above 0.'); return; }
      expenses.push(E(val('xu'),'2026-11-21',null,to,line||'General',v,'pending',val('xf'),val('xb'))); log(`Recorded expense: ${to} ${v.toLocaleString('en-US')}`); S.sheet=null; toast('Expense saved. Waiting for approval.'); break; }
    case 'savepledge': { const v=parseFloat(val('ppa')), c=campaigns.find(x=>x.id===id), p=c.pledges[i]; if(!(v>0)){ toast('Enter an amount above 0.'); return; } p.paid+=v; txs.push(T(c.u,'2026-11-21','Fundraising',`${c.name} — pledge payment`,v)); log(`Recorded pledge payment for ${c.name}: ${v.toLocaleString('en-US')}`); S.sheet=null; toast('Pledge payment saved.'); break; }
    case 'addunit': { const n=val('newunit').trim(); if(!n){ toast('Type a name first.'); return; } units.push({id:'u'+Date.now(),name:n,kind:'sub',open:0}); log(`Added ${C().sub.toLowerCase()}: ${n}`); toast(`${n} added.`); break; }
    case 'hshow': S.showHigher=true; break;
    case 'hcancel': S.showHigher=false; break;
    case 'hadd': { const n=val('hname').trim(), lv=val('hlevel'); if(!n){ toast('Type a name first.'); return; } const ord=C().higher.slice().reverse(); higher.push({level:lv,name:n}); higher.sort((x,y)=>ord.indexOf(x.level)-ord.indexOf(y.level)); S.showHigher=false; log(`Added ${lv}: ${n}`); toast(`${n} (${lv}) added above.`); break; }
    case 'add-member': { const n=val('sname').trim(); if(!n){ toast('Type a name first.'); return; } members.push({id:'m'+Date.now(),name:n,day:'',units:[firstUnit()],phone:'—',tithe:MONTHS.map((_,m)=>m>NOW_M?null:0),dues:MONTHS.map((_,m)=>m>NOW_M?null:0),welfare:0,funeral:0,thanks:0}); log(`Added member: ${n}`); S.sheet=null; S.q=n; toast(`${n} added.`); break; }
    case 'add-payee': { const n=val('sname').trim(); if(!n){ toast('Type a name first.'); return; } payees.push({id:'p'+Date.now(),u:firstUnit(),kind:S.spendKind==='all'?'person':S.spendKind,name:n,sub:'New',lines:[{n:'Monthly support',f:'Monthly',a:200,b:''}]}); log(`Added ${S.spendKind}: ${n}`); S.sheet=null; toast(`${n} added. Open it to set up support lines.`); break; }
    case 'add-camp': { const n=val('sname').trim(), v=parseFloat(val('starget')); if(!n||!(v>0)){ toast('Enter a name and a target above 0.'); return; } campaigns.push({id:'c'+Date.now(),u:firstUnit(),name:n,target:v,ends:'—',extra:0,pledges:[]}); log(`Started fundraising: ${n}`); S.sheet=null; toast(`${n} started.`); break; }
    case 'saveincome': { const v=parseFloat(val('ia')); if(!(v>0)){ toast('Enter an amount above 0.'); return; } const t=val('it'), m=members.find(x=>x.id===val('im')), sms=chk('isms');
      txs.push(T(val('iu'),'2026-11-21',t,m?`${t} — ${m.name}`:t,v));
      if(m){ if(t===C().income[1]) m.tithe[NOW_M]=(m.tithe[NOW_M]||0)+v; if(t==='Monthly dues') m.dues[NOW_M]=(m.dues[NOW_M]||0)+v; if(t==='Welfare dues') m.welfare+=v; if(t==='Funeral dues') m.funeral+=v; if(t===C().income[2]) m.thanks+=v; }
      log(`Recorded ${t} ${v.toLocaleString('en-US')}${m?' — '+m.name:''}`); S.sheet=null; toast(`${t} of ${fmt(v)} saved. Receipt #2026-${String(txs.length).padStart(4,'0')}${m&&sms?' texted to '+m.name.split(' ')[0]:''}.`); break; }
    case 'savename': S.orgName=val('setname').trim(); S.cur=val('setcur'); toast('Settings saved.'); break;
    case 'close': case 'bg': S.sheet=null; break;
  }
  render();
});
function orgSafe(s){ return S.type==='org'?orgify(s):s; }
document.addEventListener('input', e=>{
  if(e.target.id==='msearch'){ S.q=e.target.value; document.getElementById('mlist').innerHTML=memberList(members.filter(m=>m.units.some(inScope))); }
  if(e.target.dataset.day!==undefined){ S.sunday[+e.target.dataset.day]=e.target.value; document.getElementById('stotal').textContent=fmt(S.sunday.reduce((s,v)=>s+(parseFloat(v)||0),0)); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='unitsel'){ S.view=e.target.value; S.member=S.payee=S.camp=null; S.group=null; render(); }
  if(e.target.dataset.feat){ S.feat[e.target.dataset.feat]=e.target.checked; render(); }
  if(e.target.id==='setcur'){ S.cur=e.target.value; render(); }
});
const tip=document.getElementById('tip');
document.addEventListener('pointerover', e=>{ const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t){ tip.hidden=true; return; } const r=t.getBoundingClientRect(); tip.textContent=t.dataset.tip; tip.style.left=Math.min(window.innerWidth-90,Math.max(90,r.left+r.width/2))+'px'; tip.style.top=(r.top+r.height*0.2)+'px'; tip.hidden=false; });
document.addEventListener('scroll', ()=>{ tip.hidden=true; }, {passive:true});
let lastDesk=isDesk(); window.addEventListener('resize', ()=>{ if(isDesk()!==lastDesk){ lastDesk=isDesk(); render(); } });
render();
</script>
